<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Nuevo Titulado - ARCUSUR</title>
    <link rel="stylesheet" th:href="@{/css/arclon.css}" href="css/arclon.css">
    <style>
        .extra-input { margin-top: 8px; display: none; }
    </style>
    <script>
        function gestionarOtro(selectId, inputId) {
            const select = document.getElementById(selectId);
            const inputContainer = document.getElementById(inputId);
            if (select.value === 'Otro') {
                inputContainer.style.display = 'block';
                inputContainer.required = true;
            } else {
                inputContainer.style.display = 'none';
                inputContainer.required = false;
                inputContainer.value = '';
            }
        }
    </script>
</head>
<body>
<div class="layout">
 
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand"><span>//</span> ARCUSUR</div>
        <div class="nav-title">Menú</div>
        <nav class="nav">
            <a th:href="@{/}" href="/">Cargar datos</a>
            <a class="active" th:href="@{/nuevo-titulado}" href="#">Nuevo titulado</a>
            <span class="disabled">Resultados</span>
        </nav>
    </aside>
 
    <!-- Contenido -->
    <main class="main">
        <header class="topbar">
            <h1>Registrar Nuevo Encuestado (Titulado)</h1>
            <small>Ingeniería en Sistemas - UMSS</small>
        </header>
 
        <div class="card form-card">
            <p class="card-title">Datos del titulado <span class="badge blue">Nuevo</span></p>
 
            <form th:action="@{/guardar-titulado}" th:object="${nuevoTitulado}" method="post">
                <div class="form-group">
                    <label class="field">Correo Electrónico:</label>
                    <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com" required />
                </div>
 
                <div class="grid grid-2" style="gap: 16px;">
                    <div class="form-group">
                        <label class="field">Edad:</label>
                        <input type="number" th:field="*{edad}" required />
                    </div>
                    <div class="form-group">
                        <label class="field">Años de Vida Profesional:</label>
                        <input type="number" th:field="*{anosVidaProfesional}" required />
                    </div>
                </div>
 
                <!-- Área de Interés en Posgrado con opción Otro -->
                <div class="form-group">
                    <label class="field">Área de Interés en Posgrado:</label>
                    <select id="selectArea" th:field="*{areaInteresPosgrado}" onchange="gestionarOtro('selectArea', 'inputAreaOtro')">
                        <option value="IA">Inteligencia Artificial</option>
                        <option value="Ingenieria de Software">Ingeniería de Software</option>
                        <option value="Redes de Datos y Seguridad">Redes y Ciberseguridad</option>
                        <option value="Base de Datos">Base de Datos</option>
                        <option value="Robótica">Robótica</option>
                        <option value="Otro">Otro (Especificar)</option>
                    </select>
                    <input type="text" id="inputAreaOtro" name="areaInteresOtro" class="extra-input" placeholder="Escribe el área personalizada..." />
                </div>
 
                <!-- Fuente de Financiamiento con opción Otro -->
                <div class="form-group">
                    <label class="field">Fuente de Financiamiento:</label>
                    <select id="selectFuente" th:field="*{fuenteFinanciamiento}" onchange="gestionarOtro('selectFuente', 'inputFuenteOtro')">
                        <option value="Propio">Recursos Propios</option>
                        <option value="Beca">Beca / Convenio</option>
                        <option value="Empresa">Financiado por Empresa</option>
                        <option value="Otro">Otro (Especificar)</option>
                    </select>
                    <input type="text" id="inputFuenteOtro" name="fuenteFinanciamientoOtro" class="extra-input" placeholder="Escribe la fuente personalizada..." />
                </div>
 
                <button type="submit" class="btn btn-block">Guardar Registro</button>
            </form>
 
            <div class="actions" style="margin-top: 16px;">
                <a href="/" th:href="@{/}" class="btn btn-outline">← Volver al Menú Principal</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
